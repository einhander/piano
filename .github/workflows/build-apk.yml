name: Build APK

# Builds the debug + release APKs for the Piano Sequencer and runs the JVM
# unit tests (MIDI parser regression suite).
#
# Toolchain (mirrors AGENTS.md): JDK 17, Android SDK (API 34),
# NDK 26.1.10909125, CMake 3.22.1, Gradle 8.5 (via wrapper), C++17.
#
# Release signing: when the PIANO_KEYSTORE_BASE64 secret is present, the
# keystore is materialized from base64 and credentials are injected into
# gradle.properties, so app/build.gradle.kts produces a signed app-release.apk.
# Without the secret the release APK stays unsigned (for inspection only).
#
# GitHub Releases: pushing a tag v* (e.g. v0.1.0) runs the build, then a
# second `release` job creates a GitHub Release with the signed APK attached.
#
# Versioning: app/build.gradle.kts derives versionName from git. Tag-triggered
# builds (HEAD == a tag) ship the bare version ("0.0.5"); every other build
# (branch/PR/local) appends the short commit hash ("0.0.5~abc1234") so the
# exact source of an APK is identifiable. No CI-specific wiring is needed —
# the gradle script auto-detects the tag via `git describe --exact-match`.

on:
  push:
    branches: [master, feature/lsp-plugins-integration]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # FluidSynth + Oboe are git submodules required for the native build.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK components
        # ubuntu-latest ships with the Android SDK + sdkmanager preinstalled at
        # ANDROID_HOME, but sdkmanager is not on PATH. Install the exact
        # components app/build.gradle.kts requires (compileSdk 34, NDK 26.1,
        # CMake 3.22.1). Direct sdkmanager calls are used because
        # setup-android@v3 mangles multi-line `packages:` input.
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/current/bin:$PATH"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" | sed -n '1p;/installed/p'

      - name: Materialize release keystore (if secret present)
        # Decode the base64 keystore into app/piano-release.jks and write the
        # signing credentials to gradle.properties (read by build.gradle.kts).
        # No-op without the secret → release build stays unsigned.
        if: env.PIANO_KEYSTORE_BASE64 != ''
        env:
          PIANO_KEYSTORE_BASE64: ${{ secrets.PIANO_KEYSTORE_BASE64 }}
        run: |
          set -e
          # Strip accidental whitespace/newlines from the secret.
          clean="$(printf '%s' "$PIANO_KEYSTORE_BASE64" | tr -d ' \r\n\t')"
          echo "Secret length (cleaned): ${#clean} chars"
          # Report any non-base64 characters (A-Za-z0-9+/=).
          bad="$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=')"
          if [ -n "$bad" ]; then
            echo "::warning::Non-base64 characters found in secret (showing as hex):"
            printf '%s' "$bad" | od -An -tx1 | sed 's/^/  /'
          fi
          # Decode. -i ignores non-alphabet chars as a safety net.
          printf '%s' "$clean" | base64 -di > app/piano-release.jks || {
            echo "::error::base64 decode failed. The secret is not valid base64."
            exit 1
          }
          echo "Decoded size: $(wc -c < app/piano-release.jks) bytes"
          # Sanity-check the decoded file looks like a keystore (PKCS12/JKS magic).
          if ! head -c4 app/piano-release.jks | od -An -tx1 | grep -qiE 'fe ed|30 82'; then
            echo "::warning::Decoded keystore does not start with a JKS/PKCS12 magic (fe ed.. / 30 82..)."
            echo "  First bytes: $(head -c8 app/piano-release.jks | od -An -tx1)"
            echo "  The PIANO_KEYSTORE_BASE64 secret may be truncated or corrupted."
          fi
          {
            # Ensure gradle.properties ends with a newline before appending,
            # otherwise the first property glues onto the last line.
            if [ -f gradle.properties ] && [ "$(tail -c1 gradle.properties | od -An -c | tr -d ' ')" != "\\n" ]; then
              printf '\n' >> gradle.properties
            fi
            echo "piano.storePassword=${{ secrets.PIANO_KEYSTORE_PASSWORD }}"
            echo "piano.keyAlias=${{ secrets.PIANO_KEY_ALIAS }}"
            echo "piano.keyPassword=${{ secrets.PIANO_KEY_PASSWORD }}"
          } >> gradle.properties
          echo "Keystore materialized:"; ls -la app/piano-release.jks

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build LSP LADSPA bundle from the submodule
        # Cross-compile liblsp-plugins-ladspa.so (arm64-v8a) from the pinned LSP
        # submodule (third_party/lsp @ 1.2.34) and copy it into the jniLibs
        # prebuilt dir before assembling the APK, so the APK ships the bundle.
        # The .so is gitignored; it must be (re)produced here every CI run.
        run: |
          set -e
          bash app/src/main/cpp/lsp-integration/build-lsp-ladspa-android.sh
          mkdir -p app/src/main/cpp/lsp-integration/prebuilt/arm64-v8a
          cp app/src/main/cpp/third_party/lsp/.build/target/lsp-plugin-fw/lsp-plugins-ladspa.so \
             app/src/main/cpp/lsp-integration/prebuilt/arm64-v8a/liblsp-plugins-ladspa.so
          ls -lh app/src/main/cpp/lsp-integration/prebuilt/arm64-v8a/liblsp-plugins-ladspa.so

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --warning-mode none

      - name: Build release APK
        # lintVitalRelease fails the build because targetSdk=29 triggers the
        # ExpiredTargetSdkVersion lint check (Google Play wants >= 33). Bumping
        # targetSdk is a product decision, not a CI concern; disable the vital
        # lint gate here so the release APK is still produced (signed when the
        # keystore secret is present, unsigned otherwise).
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon --warning-mode none

      - name: Verify release signature
        # Report whether the release APK ended up signed.
        run: |
          apk=$(ls app/build/outputs/apk/release/app-release*.apk 2>/dev/null | head -1)
          echo "APK: $apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk" 2>&1 | sed 's/^/  /' || echo "  (unsigned / apksigner not available)"

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --warning-mode none

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

  # Creates a GitHub Release (Releases tab) with the signed APK attached.
  # Only runs on tag pushes (v*); reuses the artifacts produced by `build`.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by gh release create

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: artifacts

      - name: Inspect downloaded APK
        run: |
          ls -la artifacts
          apk=$(ls artifacts/app-release*.apk | head -1)
          echo "Release APK: $apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          echo "Creating release for tag $tag"
          # Rename to a friendly filename inside the release.
          cp "$APK_PATH" "piano-sequencer-${tag}.apk"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            "piano-sequencer-${tag}.apk"
